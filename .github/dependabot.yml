version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Keep security updates, stop routine version-update pull requests.
    open-pull-requests-limit: 0
    groups:
      security-updates:
        applies-to: security-updates
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      security-updates:
        applies-to: security-updates
        patterns: ['*']
